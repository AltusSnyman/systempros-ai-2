[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/andrea"
  to = "/marketing/google-business-profile/"
  status = 301

[[redirects]]
  from = "/andrea/"
  to = "/marketing/google-business-profile/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
